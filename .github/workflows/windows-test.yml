name: Windows runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_PHP_VERSION: '7.4.33'
  PHP_SDK_REF: php-sdk-2.7.1
  TARGET_BRANCH: PHP-7.4.33-CVE-2026-109618-109619
  # Must stay identical to build-php-windows.yml. The SDK's 7.4 dependency series is published for vc15 only, and
  # windows-2022 has no VS 2019/2017, so the vc15 starter is combined with the VS 2022 image's v142 (14.29) toolset.
  PHP_SDK_STARTER: phpsdk-vc15-x64.bat
  PHP_SDK_CRT: vc15
  MSVC_TOOLSET: '14.29'

jobs:
  diagnostics:
    runs-on: windows-2022
    steps:
      - name: Check out the selected branch and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce target branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:GITHUB_WORKSPACE
          $expectedRef = "refs/heads/$env:TARGET_BRANCH"
          $errors = @()
          Write-Host "Target branch: $env:TARGET_BRANCH"
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "GITHUB_REF: $env:GITHUB_REF (type: $env:GITHUB_REF_TYPE)"
          Write-Host "GITHUB_HEAD_REF: $env:GITHUB_HEAD_REF"
          Write-Host "GITHUB_SHA: $env:GITHUB_SHA"

          # GITHUB_HEAD_REF is only set for pull_request events; a pull-request run is never the target branch itself.
          if (-not [string]::IsNullOrEmpty($env:GITHUB_HEAD_REF)) {
            $errors += "GITHUB_HEAD_REF is set ('$env:GITHUB_HEAD_REF'): pull-request runs are not allowed"
          }
          # A dispatch against a tag or another branch has a different GITHUB_REF_TYPE/GITHUB_REF.
          if ($env:GITHUB_REF_TYPE -ne 'branch') {
            $errors += "GITHUB_REF_TYPE is '$env:GITHUB_REF_TYPE', expected 'branch'"
          }
          if ($env:GITHUB_REF -cne $expectedRef) {
            $errors += "GITHUB_REF is '$env:GITHUB_REF', expected '$expectedRef'"
          }

          # The checked-out commit must be the commit the workflow was triggered for.
          $head = "$(git -C $source rev-parse HEAD)".Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            $errors += "Could not resolve the checked-out commit (git exit code $LASTEXITCODE)"
          } elseif ($head -ne $env:GITHUB_SHA) {
            $errors += "Checked-out commit $head does not match GITHUB_SHA $env:GITHUB_SHA"
          }

          # actions/checkout normally attaches HEAD to the branch for branch refs and detaches it for
          # tags and pull requests. Exit code 1 from symbolic-ref means detached HEAD, which is only
          # acceptable here because GITHUB_REF and GITHUB_SHA were validated above.
          $headRef = "$(git -C $source symbolic-ref -q HEAD)".Trim()
          $symbolicExit = $LASTEXITCODE
          if ($symbolicExit -eq 0) {
            Write-Host "Checked-out ref: $headRef"
            if ($headRef -cne $expectedRef) {
              $errors += "Checked-out ref is '$headRef', expected '$expectedRef'"
            }
          } elseif ($symbolicExit -eq 1) {
            Write-Host 'Checked-out ref: detached HEAD (validated through GITHUB_REF and GITHUB_SHA)'
          } else {
            $errors += "git symbolic-ref failed with exit code $symbolicExit"
          }

          if ($errors.Count -gt 0) {
            throw ("This workflow only runs against branch '$env:TARGET_BRANCH'. Re-run it with that branch selected.`n" + ($errors -join "`n"))
          }
          Write-Host "Branch check passed: $expectedRef at $head"
          exit 0

      - name: Inspect source, runner, and prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:GITHUB_WORKSPACE
          $configurePath = Join-Path $source 'configure.ac'
          if (-not (Test-Path -LiteralPath $configurePath)) {
            throw "PHP source tree was not found at $source"
          }

          $configure = Get-Content -Raw -LiteralPath $configurePath
          $match = [regex]::Match($configure, '(?m)^AC_INIT\(\[PHP\],\[([^\]]+)\]')
          if (-not $match.Success) {
            throw 'Could not detect PHP version from configure.ac'
          }
          $sourceVersion = $match.Groups[1].Value
          $commit = (git -C $source rev-parse HEAD).Trim()
          $ref = (git -C $source symbolic-ref --short -q HEAD)
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = $env:GITHUB_REF }
          $validationErrors = @()

          Write-Host "Windows: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "OS architecture: $([System.Environment]::OSArchitecture)"
          Write-Host "Process architecture: $([System.Environment]::ProcessArchitecture)"
          Write-Host "GitHub ref: $env:GITHUB_REF"
          Write-Host "Checked-out ref: $ref"
          Write-Host "Checked-out commit: $commit"
          Write-Host "Detected PHP source version: $sourceVersion"

          foreach ($sourceFile in 'buildconf.bat', 'win32\build\configure.bat', 'win32\build\Makefile', 'run-tests.php') {
            if (-not (Test-Path -LiteralPath (Join-Path $source $sourceFile))) {
              $validationErrors += "Required PHP Windows build file is missing: $sourceFile"
            }
          }
          $nmake = Get-Command nmake.exe -ErrorAction SilentlyContinue
          if (-not $nmake) {
            $validationErrors += 'nmake.exe is missing from PATH; the PHP Windows build cannot run'
          } else {
            Write-Host "nmake: $($nmake.Source)"
          }

          if ($sourceVersion -ne $env:BASE_PHP_VERSION) {
            $validationErrors += "Expected PHP $env:BASE_PHP_VERSION, but configure.ac reports $sourceVersion"
          }

          git -C $source show-ref --verify --quiet "refs/tags/php-$env:BASE_PHP_VERSION"
          $tagExitCode = $LASTEXITCODE
          if ($tagExitCode -ne 0) {
            $validationErrors += "Official php-$env:BASE_PHP_VERSION tag is missing from the checkout"
          } else {
            $baseCommit = (git -C $source rev-parse "refs/tags/php-$env:BASE_PHP_VERSION^{}").Trim()
            git -C $source merge-base --is-ancestor $baseCommit HEAD
            if ($LASTEXITCODE -ne 0) {
              $validationErrors += "Checked-out commit is not based on the official php-$env:BASE_PHP_VERSION tag ($baseCommit)"
            }
          }

          $expectedSecurityCommit = '712e60f9edfd03f0960fc4fc3c2c375f42b90aa2'
          $expectedSecurityPatchId = 'f529f653265bc63f0d216016c40b25a1297b3a14'
          $securityCommit = ''
          foreach ($candidate in @(git -C $source log HEAD --format='%H' --grep='Avoid state corruption via bailout')) {
            $candidateMessage = (git -C $source show -s --format='%B' $candidate) -join "`n"
            $trailer = [regex]::Match($candidateMessage, '(?im)^\(cherry picked from commit ([0-9a-f]{40})\)$')
            if ($candidateMessage -match 'CVE-2026-109618' -and $candidateMessage -match 'CVE-2026-109619' -and (($candidate.Trim() -eq $expectedSecurityCommit) -or ($trailer.Success -and $trailer.Groups[1].Value -eq $expectedSecurityCommit))) {
              $securityCommit = $candidate.Trim()
              $securityMessage = $candidateMessage
              break
            }
          }
          if (-not $securityCommit) {
            $validationErrors += "Expected security backport commit $expectedSecurityCommit (or its -x cherry-pick) is missing from HEAD"
          } else {
            if ($securityMessage -notmatch 'CVE-2026-109618' -or $securityMessage -notmatch 'CVE-2026-109619') {
              $validationErrors += 'Expected security backport commit does not reference both requested CVEs'
            }
            git -C $source merge-base --is-ancestor $securityCommit HEAD
            if ($LASTEXITCODE -ne 0) {
              $validationErrors += 'The security backport commit in HEAD is not an ancestor of HEAD'
            }
            $securityPatchId = ((git -C $source show --format= --no-ext-diff $securityCommit | git patch-id --stable) -split '\s+')[0]
            if ($securityPatchId -ne $expectedSecurityPatchId) {
              $validationErrors += "Security patch ID $securityPatchId does not match expected patch $expectedSecurityPatchId"
            }
            $expectedPaths = @(
              'Zend/zend_API.h', 'Zend/zend_alloc.c', 'Zend/zend_alloc.h',
              'Zend/zend_execute_API.c', 'Zend/zend_hash.c', 'Zend/zend_hash.h',
              'Zend/zend_llist.c', 'Zend/zend_multiply.h', 'Zend/zend_strtod.c',
              'Zend/zend_types.h', 'Zend/zend_vm_def.h', 'Zend/zend_vm_execute.h',
              'ext/session/session.c', 'main/SAPI.c', 'main/main.c',
              'main/php_variables.c', 'main/rfc1867.c'
            )
            $actualPaths = @(git -C $source diff-tree --no-commit-id --name-only -r $securityCommit)
            $missingPaths = @($expectedPaths | Where-Object { $_ -notin $actualPaths })
            $unexpectedPaths = @($actualPaths | Where-Object { $_ -notin $expectedPaths })
            if ($missingPaths.Count -gt 0) {
              $validationErrors += "Expected security patch paths are missing: $($missingPaths -join ', ')"
            }
            if ($unexpectedPaths.Count -gt 0) {
              $validationErrors += "Unexpected security patch paths found: $($unexpectedPaths -join ', ')"
            }
            Write-Host "Expected security source commit: $expectedSecurityCommit"
            Write-Host "Security backport commit in HEAD: $securityCommit"
            Write-Host "Security patch ID: $securityPatchId"
            Write-Host "Security backport changed paths: $($actualPaths -join ', ')"
          }

          foreach ($tool in 'git.exe', 'cscript.exe') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) { Write-Host "${tool}: $($found.Source)" } else { Write-Warning "${tool} is missing from PATH" }
          }

          $sdkTag = git ls-remote --exit-code --refs https://github.com/php/php-sdk-binary-tools.git "refs/tags/$env:PHP_SDK_REF" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $validationErrors += "PHP SDK tag $env:PHP_SDK_REF could not be resolved"
          } else {
            Write-Host "PHP SDK tag is available: $sdkTag"
            $sdk = Join-Path $env:RUNNER_TEMP 'php-sdk-diagnostics'
            git clone --depth 1 --branch $env:PHP_SDK_REF https://github.com/php/php-sdk-binary-tools.git $sdk
            $cloneExitCode = $LASTEXITCODE
            if ($cloneExitCode -ne 0) {
              $validationErrors += "PHP SDK tag $env:PHP_SDK_REF could not be cloned (exit code $cloneExitCode)"
            } else {
              $sdkCommit = (git -C $sdk rev-parse HEAD).Trim()
              $sdkCommitExitCode = $LASTEXITCODE
              if ($sdkCommitExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($sdkCommit)) {
                $validationErrors += "PHP SDK commit could not be resolved (exit code $sdkCommitExitCode)"
              }
              $expectedSdkCommit = 'c73faaf1cce914e2fc04da5587132f8f425996af'
              if ($sdkCommit -ne $expectedSdkCommit) {
                $validationErrors += "PHP SDK tag resolved to unexpected commit $sdkCommit"
              }
              $starter = Join-Path $sdk $env:PHP_SDK_STARTER
              if (-not (Test-Path -LiteralPath $starter)) {
                $validationErrors += "Missing PHP SDK starter: $starter"
              } else {
                $starterText = Get-Content -Raw -LiteralPath $starter
                if ($starterText -notmatch "(?im)phpsdk-starter\.bat\s+-c\s+$([regex]::Escape($env:PHP_SDK_CRT))\s+-a\s+x64") {
                  $validationErrors += "PHP SDK starter does not select $env:PHP_SDK_CRT x64: $starter"
                }
              }
              foreach ($sdkFile in 'phpsdk-starter.bat', 'bin\phpsdk_setshell.bat', 'bin\phpsdk_setvars.bat', 'bin\phpsdk_buildtree.bat', 'bin\phpsdk_deps.bat') {
                if (-not (Test-Path -LiteralPath (Join-Path $sdk $sdkFile))) {
                  $validationErrors += "Missing PHP SDK prerequisite: $sdkFile"
                }
              }
              Write-Host "PHP SDK commit: $sdkCommit"
              Write-Host "PHP SDK starter: $starter"
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            $validationErrors += "vswhere.exe is missing: $vswhere"
          } else {
            # Convert before Trim() so "no match" yields '' (reported below) instead of a null-method exception that would discard the collected errors.
            # phpsdk_setshell.bat uses 'vswhere -latest' (no version range) whenever a toolset is passed with -s; mirror that here.
            $vsFound = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
            $vsPath = "$vsFound".Trim()
            if ([string]::IsNullOrWhiteSpace($vsPath)) {
              $validationErrors += 'No Visual Studio installation with MSVC x86/x64 C++ tools was found'
            } else {
              Write-Host "Visual Studio installation: $vsPath"
              $v142 = @(Get-ChildItem -LiteralPath (Join-Path $vsPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue | Where-Object Name -like "$env:MSVC_TOOLSET*")
              if (-not $v142) { $validationErrors += "MSVC toolset $env:MSVC_TOOLSET (passed to the SDK as -s $env:MSVC_TOOLSET) was not found under $vsPath" }
              $windowsKitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
              $windowsKits = @(Get-ChildItem -LiteralPath $windowsKitsRoot -Directory -ErrorAction SilentlyContinue | Where-Object {
                (Test-Path (Join-Path $_.FullName 'ucrt')) -and (Test-Path (Join-Path $_.FullName 'um'))
              })
              if (-not $windowsKits) { $validationErrors += "No Windows 10 SDK UCRT/UM headers were found under $windowsKitsRoot" }
              Write-Host "MSVC toolset directories matching ${env:MSVC_TOOLSET}: $($v142.Name -join ', ')"
              Write-Host "Windows SDK include directories: $($windowsKits.Name -join ', ')"
            }
          }

          # phpsdk_deps only accepts a CRT name for which the server publishes a dependency series for the branch.
          $seriesUrl = 'https://downloads.php.net/~windows/php-sdk/deps/series/'
          $seriesWanted = "packages-7.4-$env:PHP_SDK_CRT-x64-"
          try {
            $seriesListing = (Invoke-WebRequest -Uri $seriesUrl -UseBasicParsing).Content
            if ($seriesListing -notmatch [regex]::Escape($seriesWanted)) {
              $validationErrors += "The PHP SDK dependency series list at $seriesUrl has no '$seriesWanted*' file for branch 7.4"
            } else {
              Write-Host "PHP SDK dependency series found: $seriesWanted*"
            }
          } catch {
            $validationErrors += "Could not read the PHP SDK dependency series list ($seriesUrl): $($_.Exception.Message)"
          }

          Write-Host 'The diagnostic workflow does not compile PHP or modify source files.'
          if ($validationErrors.Count -gt 0) {
            throw ($validationErrors -join "`n")
          }
          # Handled non-zero native exit codes above (e.g. detached-HEAD symbolic-ref) must not become the step's exit code.
          exit 0
