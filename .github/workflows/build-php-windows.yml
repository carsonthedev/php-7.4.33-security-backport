name: Build PHP 7.4.33 for Windows IIS FastCGI

on:
  workflow_dispatch:
  push:
    branches:
      - PHP-7.4.33-CVE-2026-109618-109619

permissions:
  contents: read

env:
  BASE_PHP_VERSION: '7.4.33'
  PHP_SDK_REF: php-sdk-2.7.1
  PHP_ARCH: x64
  PHP_TS: nts
  TARGET_BRANCH: PHP-7.4.33-CVE-2026-109618-109619
  # The SDK's 7.4 dependency series is published for vc15 only, and phpsdk_deps rejects any other CRT name.
  # windows-2022 has no VS 2019/2017, so the vc15 starter is combined with the VS 2022 image's v142 (14.29) toolset.
  PHP_SDK_STARTER: phpsdk-vc15-x64.bat
  PHP_SDK_CRT: vc15
  MSVC_TOOLSET: '14.29'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out the triggering commit and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce target branch
        id: branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:GITHUB_WORKSPACE
          $expectedRef = "refs/heads/$env:TARGET_BRANCH"
          $errors = @()
          Write-Host "Target branch: $env:TARGET_BRANCH"
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "GITHUB_REF: $env:GITHUB_REF (type: $env:GITHUB_REF_TYPE)"
          Write-Host "GITHUB_HEAD_REF: $env:GITHUB_HEAD_REF"
          Write-Host "GITHUB_SHA: $env:GITHUB_SHA"

          # GITHUB_HEAD_REF is only set for pull_request events; a pull-request run is never the target branch itself.
          if (-not [string]::IsNullOrEmpty($env:GITHUB_HEAD_REF)) {
            $errors += "GITHUB_HEAD_REF is set ('$env:GITHUB_HEAD_REF'): pull-request runs are not allowed"
          }
          # A dispatch against a tag or another branch has a different GITHUB_REF_TYPE/GITHUB_REF.
          if ($env:GITHUB_REF_TYPE -ne 'branch') {
            $errors += "GITHUB_REF_TYPE is '$env:GITHUB_REF_TYPE', expected 'branch'"
          }
          if ($env:GITHUB_REF -cne $expectedRef) {
            $errors += "GITHUB_REF is '$env:GITHUB_REF', expected '$expectedRef'"
          }

          # The checked-out commit must be the commit the workflow was triggered for.
          $head = "$(git -C $source rev-parse HEAD)".Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            $errors += "Could not resolve the checked-out commit (git exit code $LASTEXITCODE)"
          } elseif ($head -ne $env:GITHUB_SHA) {
            $errors += "Checked-out commit $head does not match GITHUB_SHA $env:GITHUB_SHA"
          }

          # actions/checkout normally attaches HEAD to the branch for branch refs and detaches it for
          # tags and pull requests. Exit code 1 from symbolic-ref means detached HEAD, which is only
          # acceptable here because GITHUB_REF and GITHUB_SHA were validated above.
          $headRef = "$(git -C $source symbolic-ref -q HEAD)".Trim()
          $symbolicExit = $LASTEXITCODE
          if ($symbolicExit -eq 0) {
            Write-Host "Checked-out ref: $headRef"
            if ($headRef -cne $expectedRef) {
              $errors += "Checked-out ref is '$headRef', expected '$expectedRef'"
            }
          } elseif ($symbolicExit -eq 1) {
            Write-Host 'Checked-out ref: detached HEAD (validated through GITHUB_REF and GITHUB_SHA)'
          } else {
            $errors += "git symbolic-ref failed with exit code $symbolicExit"
          }

          if ($errors.Count -gt 0) {
            throw ("This workflow only runs against branch '$env:TARGET_BRANCH'. Re-run it with that branch selected.`n" + ($errors -join "`n"))
          }
          Write-Host "Branch check passed: $expectedRef at $head"
          exit 0

      - name: Verify PHP base version and security-patch provenance
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:GITHUB_WORKSPACE
          $report = Join-Path $env:RUNNER_TEMP 'source-verification.txt'
          $configure = Get-Content -Raw -LiteralPath (Join-Path $source 'configure.ac')
          $versionMatch = [regex]::Match($configure, '(?m)^AC_INIT\(\[PHP\],\[([^\]]+)\]')
          if (-not $versionMatch.Success) { throw 'Could not detect PHP version from configure.ac' }
          $sourceVersion = $versionMatch.Groups[1].Value
          $commit = (git -C $source rev-parse HEAD).Trim()
          $baseTag = "refs/tags/php-$env:BASE_PHP_VERSION"
          $baseCommit = ''
          $baseStatus = 'not checked'
          git -C $source show-ref --verify --quiet $baseTag
          $tagExitCode = $LASTEXITCODE
          if ($tagExitCode -eq 0) {
            $baseCommit = (git -C $source rev-parse "$baseTag^{}").Trim()
            git -C $source merge-base --is-ancestor $baseCommit HEAD
            $baseStatus = if ($LASTEXITCODE -eq 0) { 'verified ancestor' } else { 'not an ancestor' }
          } else {
            $baseStatus = 'tag missing'
          }

          $expectedSecurityCommit = '712e60f9edfd03f0960fc4fc3c2c375f42b90aa2'
          $expectedSecurityPatchId = 'f529f653265bc63f0d216016c40b25a1297b3a14'
          $securityCommit = ''
          $securitySourceCommit = ''
          $securityPatchId = ''
          $securityMessage = ''
          $securityAncestry = 'not checked'
          foreach ($candidate in @(git -C $source log HEAD --format='%H' --grep='Avoid state corruption via bailout')) {
            $message = git -C $source show -s --format='%B' $candidate
            if ($message -match 'CVE-2026-109618' -and $message -match 'CVE-2026-109619') {
              $securityCommit = $candidate.Trim()
              $trailer = [regex]::Match(($message -join "`n"), '(?im)^\(cherry picked from commit ([0-9a-f]{40})\)$')
              $securitySourceCommit = if ($trailer.Success) { $trailer.Groups[1].Value } else { $securityCommit }
              $securityMessage = ($message -join "`n").Trim()
              break
            }
          }
          if ($securityCommit) {
            git -C $source merge-base --is-ancestor $securityCommit HEAD
            if ($LASTEXITCODE -ne 0) {
              $securityAncestry = 'not an ancestor'
            } else {
              $securityAncestry = 'verified ancestor'
            }
            # The pipeline's exit status is only that of its last command, so check the commit resolves first
            # and check patch-id's own status; an empty or failed result can never equal the expected patch ID.
            git -C $source cat-file -e "$securityCommit^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Security patch commit $securityCommit cannot be read (git exit code $LASTEXITCODE)" }
            $securityPatchId = ((git -C $source show --format= --no-ext-diff $securityCommit | git patch-id --stable) -split '\s+')[0]
            if ($LASTEXITCODE -ne 0) { throw "git patch-id failed with exit code $LASTEXITCODE" }
          }

          $expectedPaths = @(
            'Zend/zend_API.h', 'Zend/zend_alloc.c', 'Zend/zend_alloc.h',
            'Zend/zend_execute_API.c', 'Zend/zend_hash.c', 'Zend/zend_hash.h',
            'Zend/zend_llist.c', 'Zend/zend_multiply.h', 'Zend/zend_strtod.c',
            'Zend/zend_types.h', 'Zend/zend_vm_def.h', 'Zend/zend_vm_execute.h',
            'ext/session/session.c', 'main/SAPI.c', 'main/main.c',
            'main/php_variables.c', 'main/rfc1867.c'
          )
          $actualPaths = @()
          $missingPaths = @()
          $unexpectedPaths = @()
          if ($securityCommit) {
            $actualPaths = @(git -C $source diff-tree --no-commit-id --name-only -r $securityCommit)
            $missingPaths = @($expectedPaths | Where-Object { $_ -notin $actualPaths })
            $unexpectedPaths = @($actualPaths | Where-Object { $_ -notin $expectedPaths })
          }

          @(
            "Source commit: $commit"
            "Base release requested: php-$env:BASE_PHP_VERSION"
            "Base release commit: $baseCommit"
            "Base release ancestry: $baseStatus"
            "configure.ac version: $sourceVersion"
            "Architecture: $env:PHP_ARCH"
            "Thread safety: $env:PHP_TS"
            "Expected security source commit: $expectedSecurityCommit"
            "Security patch commit in HEAD: $(if ($securityCommit) { $securityCommit } else { 'not found' })"
            "Security source commit recorded by cherry-pick: $(if ($securitySourceCommit) { $securitySourceCommit } else { 'not found' })"
            "Security patch ID: $(if ($securityPatchId) { $securityPatchId } else { 'not calculated' })"
            "Security patch ancestry: $securityAncestry"
            'Security patch message:'
            $securityMessage
            'Security patch changed paths:'
            ($actualPaths | Sort-Object)
            'Unexpected security patch paths:'
            ($unexpectedPaths | Sort-Object)
            'Security conclusion: commit/path provenance is recorded only; compilation and these checks do not prove either CVE is fixed.'
          ) | Set-Content -LiteralPath $report -Encoding utf8
          Get-Content -LiteralPath $report

          if ($sourceVersion -ne $env:BASE_PHP_VERSION) {
            throw "Expected PHP $env:BASE_PHP_VERSION, but configure.ac reports $sourceVersion"
          }
          if ($baseStatus -ne 'verified ancestor') {
            throw "The checked-out source is not based on the official php-$env:BASE_PHP_VERSION release tag"
          }
          if (-not $securityCommit) {
            throw 'The commit naming both requested CVEs was not found; security patch provenance is unverified'
          }
          if ($securitySourceCommit -ne $expectedSecurityCommit) {
            throw "The security patch does not identify expected source commit $expectedSecurityCommit"
          }
          if ($securityPatchId -ne $expectedSecurityPatchId) {
            throw "The security patch ID $securityPatchId does not match expected patch $expectedSecurityPatchId"
          }
          if ($securityAncestry -ne 'verified ancestor') {
            throw 'The security patch is not an ancestor of the checked-out source.'
          }
          if ($missingPaths.Count -gt 0) {
            throw "Security patch changed-file verification is incomplete: $($missingPaths -join ', ')"
          }
          if ($unexpectedPaths.Count -gt 0) {
            throw "Security patch changed-file verification found unexpected paths: $($unexpectedPaths -join ', ')"
          }
          # Handled non-zero native exit codes above (e.g. an ancestry probe) must not become the step's exit code.
          exit 0

      - name: Provision PHP SDK and verify the MSVC toolchain
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'php-sdk'
          git clone --depth 1 --branch $env:PHP_SDK_REF https://github.com/php/php-sdk-binary-tools.git $sdk
          $cloneExitCode = $LASTEXITCODE
          if ($cloneExitCode -ne 0) { throw "PHP SDK clone failed with exit code $cloneExitCode" }
          $sdkCommit = (git -C $sdk rev-parse HEAD).Trim()
          $sdkCommitExitCode = $LASTEXITCODE
          if ($sdkCommitExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($sdkCommit)) { throw "Could not resolve the PHP SDK commit (exit code $sdkCommitExitCode)" }
          $sdkTag = "$(git -C $sdk describe --tags --exact-match HEAD 2>$null)".Trim()
          $sdkTagExitCode = $LASTEXITCODE
          if ($sdkTagExitCode -ne 0) { throw "Could not verify the PHP SDK tag at HEAD (exit code $sdkTagExitCode)" }
          if ($sdkTag -ne $env:PHP_SDK_REF) { throw "PHP SDK checkout is not at the requested tag $env:PHP_SDK_REF" }
          $expectedSdkCommit = 'c73faaf1cce914e2fc04da5587132f8f425996af'
          if ($sdkCommit -ne $expectedSdkCommit) { throw "PHP SDK tag $env:PHP_SDK_REF resolved to unexpected commit $sdkCommit" }
          $starter = Join-Path $sdk $env:PHP_SDK_STARTER
          if (-not (Test-Path -LiteralPath $starter)) { throw "Missing PHP SDK starter: $starter" }
          foreach ($sdkFile in 'phpsdk-starter.bat', 'bin\phpsdk_setshell.bat', 'bin\phpsdk_setvars.bat', 'bin\phpsdk_buildtree.bat', 'bin\phpsdk_deps.bat') {
            $sdkPath = Join-Path $sdk $sdkFile
            if (-not (Test-Path -LiteralPath $sdkPath)) { throw "Missing PHP SDK prerequisite: $sdkPath" }
          }
          $starterText = Get-Content -Raw -LiteralPath $starter
          if ($starterText -notmatch "(?im)phpsdk-starter\.bat\s+-c\s+$([regex]::Escape($env:PHP_SDK_CRT))\s+-a\s+x64") {
            throw "PHP SDK starter does not select the required $env:PHP_SDK_CRT x64 environment: $starter"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found: $vswhere" }
          # phpsdk_setshell.bat uses 'vswhere -latest' (no version range) whenever a toolset is passed with -s; mirror that here.
          $vsPath = "$(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)".Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw 'No Visual Studio installation with MSVC x86/x64 C++ tools was found' }
          $v142 = @(Get-ChildItem -LiteralPath (Join-Path $vsPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue | Where-Object Name -like "$env:MSVC_TOOLSET*")
          if (-not $v142) { throw "MSVC toolset $env:MSVC_TOOLSET (passed to the SDK as -s $env:MSVC_TOOLSET) was not found under $vsPath" }
          $windowsKitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $windowsKits = @(Get-ChildItem -LiteralPath $windowsKitsRoot -Directory -ErrorAction SilentlyContinue | Where-Object {
            (Test-Path (Join-Path $_.FullName 'ucrt')) -and (Test-Path (Join-Path $_.FullName 'um'))
          })
          if (-not $windowsKits) { throw "A Windows 10 SDK with UCRT and UM headers was not found under $windowsKitsRoot" }

          @(
            "PHP SDK tag: $sdkTag"
            "PHP SDK commit: $sdkCommit"
            "SDK starter: $starter"
            "SDK starter selection: $env:PHP_SDK_CRT x64 with MSVC toolset $env:MSVC_TOOLSET"
            "Visual Studio installation: $vsPath"
            "MSVC toolset directories matching ${env:MSVC_TOOLSET}: $($v142.Name -join ', ')"
            "Windows SDK include directories: $($windowsKits.Name -join ', ')"
            "Architecture: $env:PHP_ARCH"
            "Thread safety: $env:PHP_TS"
          ) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'toolchain-report.txt') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'toolchain-report.txt')
          exit 0

      - name: Configure, compile, and run regression tests
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'php-sdk'
          $starter = Join-Path $sdk $env:PHP_SDK_STARTER
          $script = Join-Path $env:RUNNER_TEMP 'build-php.cmd'
          $status = Join-Path $env:RUNNER_TEMP 'build-status.txt'
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          # phpsdk-starter.bat keeps the -t value verbatim and later runs it as an unquoted command, so neither
          # path may contain whitespace; both are passed unquoted.
          foreach ($path in $starter, $script) {
            if ($path -match '\s') { throw "Path must not contain whitespace: $path" }
          }
          Remove-Item -LiteralPath $status, $log -Force -ErrorAction SilentlyContinue
          $scriptContent = @"
          @echo off
          setlocal EnableExtensions
          set "STATUS_FILE=$status"
          > "%STATUS_FILE%" echo build=started
          cd /d "%PHP_SDK_ROOT_PATH%"
          call phpsdk_buildtree.bat phpdev
          if not "%ERRORLEVEL%"=="0" goto :fail_buildtree
          >> "%STATUS_FILE%" echo build-tree=passed
          cd /d "%GITHUB_WORKSPACE%"
          call phpsdk_deps.bat --update --branch 7.4
          if not "%ERRORLEVEL%"=="0" goto :fail_deps
          >> "%STATUS_FILE%" echo dependencies=passed
          if exist configure.js del /q configure.js
          if exist configure.bat del /q configure.bat
          call buildconf.bat --force
          rem buildconf.bat does not propagate the exit code of cscript, so verify its generated files instead.
          if not exist configure.js goto :fail_buildconf
          if not exist configure.bat goto :fail_buildconf
          rem configure.js intentionally exits with status 1 after --help; other statuses indicate generation/runtime failure.
          cscript /nologo /e:jscript configure.js --help >nul
          if not "%ERRORLEVEL%"=="1" goto :fail_buildconf
          >> "%STATUS_FILE%" echo buildconf=passed
          call configure.bat --disable-all --enable-cli --enable-cgi --disable-zts
          if not "%ERRORLEVEL%"=="0" goto :fail_configure
          if not exist Makefile goto :fail_configure
          >> "%STATUS_FILE%" echo configure=passed
          nmake /nologo
          if not "%ERRORLEVEL%"=="0" goto :fail_compile
          for %%F in (php.exe php-cgi.exe php7.dll) do if not exist "x64\Release\%%F" goto :fail_compile
          >> "%STATUS_FILE%" echo compile=passed
          nmake /nologo test TESTS=Zend/tests
          if not "%ERRORLEVEL%"=="0" goto :fail_tests
          >> "%STATUS_FILE%" echo tests=passed
          >> "%STATUS_FILE%" echo build-result=passed
          exit /b 0

          :fail_buildtree
          >> "%STATUS_FILE%" echo build-tree=failed
          >> "%STATUS_FILE%" echo build-result=dependency-setup-failed
          exit /b 1

          :fail_deps
          >> "%STATUS_FILE%" echo dependencies=failed
          >> "%STATUS_FILE%" echo build-result=dependency-setup-failed
          exit /b 1

          :fail_buildconf
          >> "%STATUS_FILE%" echo buildconf=failed
          >> "%STATUS_FILE%" echo build-result=configuration-failed
          exit /b 1

          :fail_configure
          >> "%STATUS_FILE%" echo configure=failed
          >> "%STATUS_FILE%" echo build-result=configuration-failed
          exit /b 1

          :fail_compile
          >> "%STATUS_FILE%" echo compile=failed
          >> "%STATUS_FILE%" echo build-result=compilation-failed
          exit /b 1

          :fail_tests
          >> "%STATUS_FILE%" echo tests=failed
          >> "%STATUS_FILE%" echo build-result=regression-tests-failed
          exit /b 1
          "@
          $scriptContent | Set-Content -LiteralPath $script -Encoding ascii

          # 2>&1 is applied inside cmd.exe so PowerShell only ever sees stdout lines; the starter's own exit code
          # is the one captured below (Tee-Object does not change $LASTEXITCODE).
          & cmd.exe /d /c "$starter -s $env:MSVC_TOOLSET -t $script 2>&1" | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE

          if (-not (Test-Path -LiteralPath $status)) { Set-Content -LiteralPath $status -Value 'build=not-started' -Encoding ascii }
          $statusLines = @(Get-Content -LiteralPath $status)
          Write-Host '--- build-status.txt ---'
          $statusLines | ForEach-Object { Write-Host $_ }
          $hasResult = @($statusLines | Where-Object { $_ -like 'build-result=*' }).Count -gt 0
          if ($exitCode -ne 0) {
            if (-not $hasResult) {
              Add-Content -LiteralPath $status -Value "build-result=build-environment-failed (SDK starter exit code $exitCode)" -Encoding ascii
            }
            throw "Build failed with exit code $exitCode; see build-status.txt and build.log"
          }
          # The SDK starter ends with 'exit /b !ERRORLEVEL!' and can swallow failures, so exit code 0 alone is not
          # accepted: the script must have recorded its own explicit success marker.
          if ('build-result=passed' -notin $statusLines) {
            Add-Content -LiteralPath $status -Value 'build-result=inconsistent (exit code 0 but no build-result=passed recorded)' -Encoding ascii
            throw 'The SDK starter exited with code 0 but the build script did not record build-result=passed'
          }
          exit 0

      - name: Validate generated PHP executables
        id: validate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $statusPath = Join-Path $env:RUNNER_TEMP 'build-status.txt'
          $outputReport = Join-Path $env:RUNNER_TEMP 'output-verification.txt'
          # Binaries are validated whenever compilation passed, even if the regression tests failed, so the report
          # can say exactly which stage failed. If compilation did not pass there is nothing trustworthy to validate.
          $statusLines = @()
          if (Test-Path -LiteralPath $statusPath) { $statusLines = @(Get-Content -LiteralPath $statusPath) }
          if ('compile=passed' -notin $statusLines) {
            @('executable-validation=skipped', 'reason: compilation did not pass, so there are no binaries to validate') | Set-Content -LiteralPath $outputReport -Encoding utf8
            Get-Content -LiteralPath $outputReport
            exit 0
          }

          $errors = @()
          $results = @("Build output directory selected by PHP win32/build/confutils.js for x64 NTS: $release")
          foreach ($name in 'php.exe', 'php-cgi.exe', 'php7.dll') {
            if (Test-Path -LiteralPath (Join-Path $release $name)) {
              $results += "${name}: present"
            } else {
              $errors += "Required build output was not found: $(Join-Path $release $name)"
              $results += "${name}: missing"
            }
          }
          foreach ($template in 'php.ini-production', 'php.ini-development') {
            if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $template)) {
              $results += "${template}: present"
            } else {
              $errors += "php.ini template was not found in the source tree: $template"
              $results += "${template}: missing"
            }
          }

          # php.exe runs 'run-time' checks of the target: version, NTS (PHP_ZTS=0) and x64 (PHP_INT_SIZE=8).
          # The code contains no quotes so native argument passing cannot alter it.
          $probeCode = 'echo PHP_VERSION, chr(124), PHP_ZTS, chr(124), PHP_INT_SIZE, chr(124), PHP_SAPI;'
          $checks = @(
            @{ Name = 'php.exe'; Sapi = 'cli' },
            @{ Name = 'php-cgi.exe'; Sapi = 'cgi-fcgi' }
          )
          foreach ($check in $checks) {
            $name = $check.Name
            $binary = Join-Path $release $name
            if (-not (Test-Path -LiteralPath $binary)) { continue }
            $versionLines = @(& $binary -n -v 2>&1)
            $exitCode = $LASTEXITCODE
            $versionText = ($versionLines -join [Environment]::NewLine).Trim()
            $results += "$name -v exit code: $exitCode"
            $results += "$name -v output: $versionText"
            if ($exitCode -ne 0) {
              $errors += "$name could not start successfully (exit code $exitCode)"
            } elseif ($versionText -notmatch ('PHP 7\.4\.33 \(' + [regex]::Escape($check.Sapi) + '\)')) {
              $errors += "$name did not report PHP 7.4.33 with the $($check.Sapi) SAPI"
            }
          }
          $php = Join-Path $release 'php.exe'
          if (Test-Path -LiteralPath $php) {
            $probeLines = @(& $php -n -r $probeCode 2>&1)
            $exitCode = $LASTEXITCODE
            $probeText = ($probeLines -join [Environment]::NewLine).Trim()
            $results += "php.exe build probe exit code: $exitCode"
            $results += "php.exe build probe (version|PHP_ZTS|PHP_INT_SIZE|SAPI): $probeText"
            if ($exitCode -ne 0) {
              $errors += "php.exe build probe failed (exit code $exitCode)"
            } elseif ($probeText -ne '7.4.33|0|8|cli') {
              $errors += "php.exe build probe reported '$probeText', expected '7.4.33|0|8|cli' (x64 NTS)"
            }
          }

          $verdict = if ($errors.Count -eq 0) { 'passed' } else { 'failed' }
          @("executable-validation=$verdict") + $results + @($errors | ForEach-Object { "error: $_" }) | Set-Content -LiteralPath $outputReport -Encoding utf8
          Get-Content -LiteralPath $outputReport
          if ($errors.Count -gt 0) {
            throw ($errors -join "`n")
          }
          exit 0

      - name: Collect binaries, reports, and checksums
        id: collect
        if: always()
        shell: pwsh
        env:
          BRANCH_OUTCOME: ${{ steps.branch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'windows-artifact'
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $release = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $temp = $env:RUNNER_TEMP

          function Get-Lines([string]$Path) {
            if (Test-Path -LiteralPath $Path) { return @(Get-Content -LiteralPath $Path) }
            return @()
          }
          $statusLines = Get-Lines (Join-Path $temp 'build-status.txt')
          $validationLines = Get-Lines (Join-Path $temp 'output-verification.txt')
          $compilation = if ('compile=passed' -in $statusLines) { 'passed' } elseif ('compile=failed' -in $statusLines) { 'failed' } else { 'not-reached' }
          $tests = if ('tests=passed' -in $statusLines) { 'passed' } elseif ('tests=failed' -in $statusLines) { 'failed' } else { 'not-reached' }
          $buildResult = @($statusLines | Where-Object { $_ -like 'build-result=*' } | Select-Object -Last 1)
          $buildResult = if ($buildResult.Count -gt 0) { $buildResult[0] } else { 'build-result=not-recorded' }
          $validationMarker = @($validationLines | Where-Object { $_ -like 'executable-validation=*' } | Select-Object -First 1)
          $validation = if ($validationMarker.Count -gt 0) { $validationMarker[0].Substring('executable-validation='.Length) } else { 'not-run' }

          # Binaries are only collected after a successful compilation; a failed or partial compile is not trusted.
          $problems = @()
          if ($compilation -eq 'passed') {
            foreach ($name in 'php.exe', 'php-cgi.exe', 'php7.dll') {
              $source = Join-Path $release $name
              if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $artifact -Force }
              else { $problems += "Required binary is missing from the build output: $source" }
            }
            foreach ($template in 'php.ini-production', 'php.ini-development') {
              $source = Join-Path $env:GITHUB_WORKSPACE $template
              if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $artifact -Force }
              else { $problems += "php.ini template is missing from the source tree: $template" }
            }
          }

          # Reports are expected only from stages that actually ran; a missing report for a stage that ran is a problem.
          $reports = @(
            @{ File = 'source-verification.txt'; Expected = ($env:VERIFY_OUTCOME -eq 'success') },
            @{ File = 'toolchain-report.txt'; Expected = ($env:TOOLCHAIN_OUTCOME -eq 'success') },
            @{ File = 'build-status.txt'; Expected = ($env:BUILD_OUTCOME -ne 'skipped') },
            @{ File = 'build.log'; Expected = ($env:BUILD_OUTCOME -ne 'skipped') },
            @{ File = 'output-verification.txt'; Expected = ($env:VALIDATE_OUTCOME -ne 'skipped') }
          )
          foreach ($report in $reports) {
            $source = Join-Path $temp $report.File
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $artifact -Force }
            elseif ($report.Expected) { $problems += "Diagnostic report is missing: $($report.File)" }
          }

          # Smoke-test the collected copies from the artifact folder: this proves php.exe/php-cgi.exe start with only
          # the collected php7.dll next to them (it does not prove the target server has the VC++ runtime installed).
          $smoke = @()
          if ($compilation -eq 'passed' -and $problems.Count -eq 0) {
            foreach ($name in 'php.exe', 'php-cgi.exe') {
              $smokeLines = @(& (Join-Path $artifact $name) -n -v 2>&1)
              $smokeExit = $LASTEXITCODE
              $smoke += "$name (collected copy) -v exit code: $smokeExit"
              if ($smokeExit -ne 0 -or (($smokeLines -join ' ') -notmatch 'PHP 7\.4\.33 ')) {
                $problems += "Collected $name does not start and report PHP 7.4.33 (exit code $smokeExit)"
              }
            }
          }

          $binaryFiles = @(Get-ChildItem -LiteralPath $artifact -File | Where-Object Extension -in '.exe', '.dll')
          if ($binaryFiles.Count -gt 0) {
            $binaryFiles | Get-FileHash -Algorithm SHA256 | ForEach-Object {
              "{0}  {1}" -f $_.Hash, $_.Path.Substring($artifact.Length + 1)
            } | Set-Content -LiteralPath (Join-Path $artifact 'SHA256SUMS.txt') -Encoding ascii
          } elseif ($compilation -eq 'passed') {
            $problems += 'No binaries were collected, so no SHA-256 checksums could be written'
          }
          $collection = if ($problems.Count -eq 0) { 'passed' } else { 'failed' }

          $failed = @()
          if ($env:BRANCH_OUTCOME -ne 'success') { $failed += 'target-branch-check' }
          if ($env:VERIFY_OUTCOME -ne 'success') { $failed += 'source-and-provenance' }
          if ($env:TOOLCHAIN_OUTCOME -ne 'success') { $failed += 'sdk-and-toolchain-setup' }
          if ($env:BUILD_OUTCOME -ne 'success' -or $buildResult -ne 'build-result=passed') { $failed += "build ($buildResult)" }
          if ($validation -ne 'passed') { $failed += "executable-validation ($validation)" }
          if ($collection -ne 'passed') { $failed += 'artifact-collection' }
          $overall = if ($failed.Count -eq 0) { 'PASSED' } else { 'FAILED' }

          $buildReport = @(
            "OVERALL: $overall"
            "Failed or incomplete stages: $(if ($failed.Count -gt 0) { $failed -join '; ' } else { 'none' })"
            ''
            'Stage results (workflow step outcomes are success, failure, skipped, or cancelled):'
            "  target-branch-check:       $env:BRANCH_OUTCOME"
            "  source-and-provenance:     $env:VERIFY_OUTCOME"
            "  sdk-and-toolchain-setup:   $env:TOOLCHAIN_OUTCOME"
            "  build-script:              $env:BUILD_OUTCOME ($buildResult)"
            "  compilation:               $compilation"
            "  regression-tests:          $tests (Zend/tests)"
            "  executable-validation:     $validation"
            "  artifact-collection:       $collection"
            ''
            "PHP base release: $env:BASE_PHP_VERSION"
            "Source commit: $env:GITHUB_SHA"
            "Architecture: $env:PHP_ARCH"
            "Thread safety: $env:PHP_TS"
            "Release output directory (x64 NTS): $release"
            ''
            'Build status file:'
            $statusLines
            ''
            'Executable validation:'
            $(if ($validationLines.Count -gt 0) { $validationLines } else { 'not run' })
            ''
            'Collected-copy smoke test:'
            $(if ($smoke.Count -gt 0) { $smoke } else { 'not run' })
            ''
            'Collection problems:'
            $(if ($problems.Count -gt 0) { $problems } else { 'none' })
            ''
            'Security conclusion: provenance checks, successful compilation, and passing tests are not proof that either CVE is fixed.'
          )
          $buildReport | Set-Content -LiteralPath (Join-Path $artifact 'build-report.txt') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $artifact 'build-report.txt')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('```') + $buildReport + @('```')) -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "verdict=$(if ($overall -eq 'PASSED') { 'passed' } else { 'FAILED' })" -Encoding utf8
          Get-ChildItem -LiteralPath $artifact | Select-Object Name, Length

          # Only the collection's own problems fail this step; failures of earlier steps already fail the job and are
          # reported above, so they are never masked or replaced by this step's result.
          if ($problems.Count -gt 0) {
            throw ("Artifact collection problems:`n" + ($problems -join "`n"))
          }
          exit 0

      - name: Upload build artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: php-${{ env.BASE_PHP_VERSION }}-${{ env.PHP_ARCH }}-${{ env.PHP_TS }}-${{ github.sha }}-${{ steps.collect.outputs.verdict || 'unknown' }}
          path: windows-artifact/
          if-no-files-found: warn
